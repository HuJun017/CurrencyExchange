<!-- conversion.html -->

<div class="card">
  <div class="card-header">
    <h2>
      <i class="bi bi-arrow-left-right"></i>
      Convertitore di Valute
    </h2>
  </div>

  <div class="card-body">

    <!-- Spinner loading -->
    <div *ngIf="loading" class="loading-overlay">
      <div class="spinner"></div>
      <span>Recupero tassi in corso&hellip;</span>
    </div>

    <form *ngIf="!loading" (submit)="converti($event)">

      <!-- Valuta di partenza -->
      <div class="mb-4">
        <label class="form-label">
          <i class="bi bi-cash-coin text-primary"></i>
          Valuta di partenza
        </label>
        <select
          class="form-select form-select-lg"
          name="from"
          [(ngModel)]="valutaDa"
          (change)="rimuoviValutaDaDaValuteA()">
          <option *ngFor="let v of valute" [value]="v">{{ v }}</option>
        </select>
      </div>

      <!-- Importo -->
      <div class="mb-4">
        <label class="form-label">
          <i class="bi bi-calculator text-success"></i>
          Importo da convertire
        </label>
        <input
          type="number"
          class="form-control form-control-lg"
          name="amount"
          [(ngModel)]="amount"
          placeholder="Es. 100"
          min="0"
          step="0.01"
          required>
      </div>

      <!-- Valute di destinazione -->
      <div class="mb-4">
        <label class="form-label">
          <i class="bi bi-box-arrow-right text-info"></i>
          Valute di conversione
        </label>

        <div *ngIf="valutaA.length === 0" class="alert alert-info">
          <i class="bi bi-info-circle-fill"></i>
          Aggiungi almeno una valuta di destinazione per convertire.
        </div>

        <div *ngFor="let valuta of valutaA; let i = index" class="currency-item">
          <div class="flex-grow-1">
            <select
              class="form-select"
              [(ngModel)]="valutaA[i]"
              [name]="'valuta-' + i"
              (change)="controllaValute()">
              <option
                *ngFor="let v of valute"
                [value]="v"
                [disabled]="(valutaA.includes(v) && valutaA[i] !== v) || v === valutaDa">
                {{ v }}
              </option>
            </select>
          </div>
          <button
            type="button"
            class="btn btn-danger btn-sm"
            (click)="rimuoviValuta(i)">
            <i class="bi bi-trash"></i>
          </button>
        </div>

        <button
          type="button"
          class="btn btn-outline-primary mt-2 w-100"
          (click)="aggiungiValuta()"
          [disabled]="valutaA.length >= valute.length - 1">
          <i class="bi bi-plus-circle"></i>
          Aggiungi valuta
        </button>
      </div>

      <!-- Bottone conversione -->
      <div class="d-grid">
        <button
          type="submit"
          class="btn btn-primary btn-lg"
          [disabled]="valutaA.length === 0">
          <i class="bi bi-arrow-repeat"></i>
          Converti Ora
        </button>
      </div>
    </form>

    <!-- RISULTATO -->
    <div *ngIf="risultato !== null && !loading" class="result-box">
      <h3>
        <i class="bi bi-check-circle-fill"></i>
        Risultato della Conversione
      </h3>
      <p class="mb-3" style="color:#065f46;">
        <span class="result-value">{{ amountStatica }}</span>
        <span style="font-size:1.1rem; font-weight:600;"> {{ valutaDaStatica }}</span>
        <span style="color:#64748b;"> &nbsp;=</span>
      </p>
      <div>
        <div *ngFor="let r of risultato" class="result-item">
          <span class="badge bg-primary">{{ r.valuta }}</span>
          <strong class="fs-5 text-success">{{ r.valore.toFixed(2) }}</strong>
        </div>
      </div>
    </div>

  </div>
</div>
